<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b0125"/><stop offset="1" stop-color="#0b0b12"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f9d24f"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c842"/><stop offset="1" stop-color="#e0ae2a"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a52a"/><stop offset="1" stop-color="#b8891a"/></linearGradient>
    <radialGradient id="hole"><stop offset="0" stop-color="#8a6410"/><stop offset="0.75" stop-color="#a3760f"/><stop offset="1" stop-color="#c99a1e"/></radialGradient>
    <!-- one isometric cheese block, 200 wide x 44 tall x 60 deep -->
    <g id="cheese">
      <path d="M0 30 L100 0 L300 0 L200 30 Z" fill="url(#top)"/>
      <path d="M0 30 L200 30 L200 74 L0 74 Z" fill="url(#front)"/>
      <path d="M200 30 L300 0 L300 44 L200 74 Z" fill="url(#side)"/>
      <ellipse cx="60" cy="52" rx="13" ry="12" fill="url(#hole)"/>
      <ellipse cx="140" cy="46" rx="8" ry="7" fill="url(#hole)"/>
      <ellipse cx="110" cy="64" rx="6" ry="5" fill="url(#hole)"/>
      <ellipse cx="180" cy="58" rx="9" ry="8" fill="url(#hole)"/>
      <ellipse cx="160" cy="12" rx="12" ry="5" fill="url(#hole)"/>
      <ellipse cx="240" cy="14" rx="9" ry="4" fill="url(#hole)"/>
      <ellipse cx="250" cy="38" rx="6" ry="8" fill="url(#hole)"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g transform="translate(210 0)">
    <use href="#cheese" x="0" y="286"/>
    <use href="#cheese" x="10" y="242" transform="scale(0.95 1) translate(10 0)"/>
    <use href="#cheese" x="-6" y="198" transform="scale(0.9 1) translate(18 0)"/>
    <use href="#cheese" x="20" y="154" transform="scale(0.84 1) translate(26 0)"/>
    <use href="#cheese" x="4" y="110" transform="scale(0.76 1) translate(48 0)"/>
    <!-- the sliding block coming in from the left -->
    <use href="#cheese" x="-170" y="62" transform="scale(0.7 1) translate(60 0)" opacity="0.95"/>
  </g>
  <text x="320" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="44" fill="#fff" letter-spacing="4">STACK CHEESE</text>
</svg>
